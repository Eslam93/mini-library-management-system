name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo/backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://library:library@localhost:5432/library
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo/frontend
    steps:
      - uses: actions/checkout@v4
      # The version comes from the app's package.json; the action looks at the repository root
      # unless it is told where to look.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: repo/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The harness half of the gate: rules, skills, hook wiring and the knowledge base.
      # The Windows-only checks skip themselves here.
      - run: bash .claude/tools/verify.sh

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t library:ci repo
